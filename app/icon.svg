<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6CC417" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6CC417" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#6CC417" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>

  <!-- round tile filling the whole canvas -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- reactive-line motif, clipped to the circle -->
  <g opacity="0.35" clip-path="url(#clip)">
    <rect x="26" y="0" width="1" height="100" fill="url(#line)"/>
    <rect x="42" y="0" width="1" height="100" fill="url(#line)"/>
    <rect x="58" y="0" width="1" height="100" fill="url(#line)"/>
    <rect x="74" y="0" width="1" height="100" fill="url(#line)"/>
  </g>

  <!-- big centered S (stroked path) -->
  <path d="M69 32.5 C63.5 23 36.5 23 36.5 39.2 C36.5 50 63.5 50 63.5 60.8 C63.5 77 36.5 77 31.1 67.5"
        stroke="#ffffff" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- signature dot on the S's top-right endpoint -->
  <circle cx="69" cy="32.5" r="10" fill="#6CC417" filter="url(#glow)"/>
</svg>
